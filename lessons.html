<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inquiry lessons | VAPA Campus Public Art</title><style>body{font:16px system-ui,sans-serif;background:#f6f8fb;color:#203453;max-width:850px;margin:50px auto;padding:0 20px}a{color:#195b99}article{background:white;padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin:15px 0;display:flex;gap:18px;align-items:center}img{width:175px;height:125px;object-fit:cover;border-radius:8px}small{color:#65758a}@media(max-width:530px){article{display:block}img{width:100%;height:170px}}</style></head><body><p><a href="index.html">← Back to campus explorer</a></p><h1>Inquiry lesson library</h1><p>Three Zamorano Fine Arts Academy murals with their matching Google Slides lessons.</p><div id="lessons"></div><script src="data.js"></script><script>document.querySelector('#lessons').innerHTML=VAPA_DATA.artworks.map(d=>`<article><img src="${d.image}" alt="Mural by ${d.artist}"><div><h3>${d.artist}</h3><small>Zamorano Fine Arts Academy</small><p><a href="${d.lessonUrl}" target="_blank" rel="noopener noreferrer">Open Google Slides lesson ↗</a></p></div></article>`).join('')</script></body></html>
